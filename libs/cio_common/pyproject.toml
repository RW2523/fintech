[project]
name = "cio-common"
version = "0.1.0"
description = "Shared plumbing: settings, ids, db, outbox, hashing, otel, auth"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9", "pydantic-settings>=2.6", "sqlalchemy[asyncio]>=2.0", "orjson>=3.10", "python-ulid>=3.0", "pyjwt>=2.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cio_common"]
