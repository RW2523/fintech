[project]
name = "cio-dff"
version = "0.1.0"
description = "Decision Factor Framework formulas, shared by the services that produce and consume them"
requires-python = ">=3.12,<3.13"
dependencies = ["cio-common"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cio_dff"]

[tool.uv.sources]
cio-common = { workspace = true }
