[project]
name = "cio-contracts"
version = "0.1.0"
description = "Generated contract models (do not hand-edit)"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cio_contracts"]
