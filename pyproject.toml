[project]
name = "credit-intelligence-os"
version = "0.1.0"
description = "Credit Intelligence OS — governed multi-agent credit decisioning for a cooperative credit institution"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  # --- web / service framework -------------------------------------------
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
  # --- data ---------------------------------------------------------------
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "redis>=5.2",
  "orjson>=3.10",
  "pyyaml>=6.0",
  "python-ulid>=3.0",
  "jsonschema>=4.23",
  # --- auth / crypto ------------------------------------------------------
  "pyjwt>=2.10",
  # --- workflow -----------------------------------------------------------
  "temporalio>=1.8",
  # --- observability ------------------------------------------------------
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp-proto-http>=1.28",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "opentelemetry-instrumentation-httpx>=0.49b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
  # Prometheus scrapes /metrics on every service (infra/observability/config
  # /prometheus.yml). Until this was added, every scrape was a 404 and every
  # dashboard drew an empty panel.
  "prometheus-client>=0.21",
  # --- workspace libraries ------------------------------------------------
  "cio-contracts",
  "cio-common",
  "cio-dff",
  "cio-tools",
]

[project.optional-dependencies]
# Heavier stacks are pulled in by the phase that needs them (see docs/PROGRESS.md).
# Array and dataframe work: needed from P2 for the synthetic programme.
data = [
  "numpy>=2.1",
  "pandas>=2.2",
  "scipy>=1.14",
]
# The modelling stack: needed from P3.
# numba and llvmlite are pinned because shap's dependency range still admits
# llvmlite 0.36, which refuses to build on Python 3.12.
ml = [
  "credit-intelligence-os[data]",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "shap>=0.46",
  "numba>=0.60",
  "llvmlite>=0.43",
  "lifelines>=0.30",
  "ruptures>=1.1",
  "statsmodels>=0.14",
]
docai = [
  "jinja2>=3.1",
  "playwright>=1.49",
  "pypdf>=5.1",
  "pillow>=11.0",
  "opencv-python-headless>=4.10",
  "pytesseract>=0.3.13",
  "pdf2image>=1.17",
  "imagehash>=4.3",
  "rapidfuzz>=3.10",
  "networkx>=3.4",
]
storage = ["minio>=7.2"]

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "hypothesis>=6.115",
  "hypothesis-jsonschema>=0.23",
  "respx>=0.21",
  "types-pyyaml>=6.0",
  "types-jsonschema>=4.23",
  "datamodel-code-generator>=0.26",
]

# ---------------------------------------------------------------------------
# uv workspace
# ---------------------------------------------------------------------------
[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "services/*", "workflows", "ai", "ml", "synthetic"]

[tool.uv.sources]
cio-contracts = { workspace = true }
cio-common = { workspace = true }
cio-dff = { workspace = true }
cio-tools = { workspace = true }

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["apps/web", "**/alembic/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = [
  "E501",    # line length handled by formatter
  "S101",    # assert is fine in tests and internal invariants
  "B008",    # FastAPI Depends() in defaults is idiomatic
  "RUF012",  # mutable class attrs without ClassVar
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "N802"]
# Exception names mirror the wire error codes in docs/08 one-for-one
# (NOT_FOUND -> NotFound). An `...Error` suffix would break that mapping.
"libs/cio_common/cio_common/errors.py" = ["N818"]
# ToolDenied and BudgetExceeded name the denial, which is what appears in the
# audit record; an `...Error` suffix would read worse at every call site.
"libs/cio_tools/cio_tools/grants.py" = ["N818"]
"synthetic/**" = ["S311"]   # non-crypto RNG is the point
"contracts/codegen/**" = ["S603", "S607"]
# The only values interpolated into SQL here are response-model field names,
# validated as bare identifiers by cols(), and a table name checked against the
# SEEDABLE allow-list. Every request value is a bound parameter.
"services/core_stub/app/routes.py" = ["S608"]
# The only value interpolated into SQL here is the column list, asserted at
# import to be bare identifiers. Every request value is a bound parameter.
"services/risk/app/repository.py" = ["S608"]
# Same here: the only interpolated values are the column lists, asserted at
# import to be bare identifiers. Every request value is a bound parameter.
"services/fraud/app/repository.py" = ["S608"]
# The timeout is handed to httpx, which enforces it on the connection. Ruff
# wants `asyncio.timeout()` around the await, which would add a second,
# competing deadline over one the HTTP client already applies correctly.
"services/llm_gateway/app/providers.py" = ["ASYNC109"]
"services/llm_gateway/app/gateway.py" = ["ASYNC109"]
# Same: the timeout goes to the HTTP client that enforces it.
"ai/rag/index.py" = ["ASYNC109", "S608"]
# Only the column list is interpolated, asserted at import to be identifiers.
"services/committee/app/repository.py" = ["S608"]
# The timeout bounds one agent's invocation and is passed to asyncio.wait_for,
# which is exactly what the rule asks for; it fires on the parameter name.
"services/committee/app/orchestrate.py" = ["ASYNC109"]
# The timeout is handed to httpx, which enforces it on the connection.
"workflows/activities.py" = ["ASYNC109"]
# The interpreter dispatches on `_<AstNodeName>`, following the stdlib
# ast.NodeVisitor convention. Lowercasing them would break the dispatch.
"services/policy/app/expr.py" = ["N802"]

[tool.ruff.lint.isort]
known-first-party = ["cio_common", "cio_contracts", "cio_tools", "ai", "ml", "synthetic", "workflows", "app"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["apps/web", "alembic/versions", "\\.venv"]

[[tool.mypy.overrides]]
module = ["tests.*", "*.tests.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers --strict-config"
testpaths = ["libs", "workflows", "synthetic", "ml", "ai", "tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "integration: requires the running compose stack",
  "failsafe: fail-safe / outage drills",
  "slow: long-running",
  "gpu: requires the GB10 GPU",
]
filterwarnings = ["error::DeprecationWarning:cio_.*"]
