# The workbench and the API on one origin (docs/13 §1).
#
# On a bench the browser talks to the app on :8080 and the gateway on :8000, and
# the vite dev server proxies between them. Nothing proxies in the compose
# `web` profile, so a published deployment would need two hostnames, two
# tunnels and CORS between them.
#
# One origin instead: this serves the built app and passes /api to the gateway.
# The tunnel then has one thing to point at, and the browser never makes a
# cross-origin request, so there is no CORS policy to get wrong.

server {
    # Both families. `listen 80` alone is IPv4 only, and the health check asks
    # for `localhost`, which resolves to ::1 first in this image — so the
    # container served every request from outside and failed its own health
    # check, which then held up everything with a depends_on against it.
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The workbench holds its token in memory only, so there is no cookie to
    # protect; these are for the rest of it. No HSTS: TLS is terminated by
    # whatever is in front, and a max-age this file cannot see the consequences
    # of is not one to set here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # `connect-src 'self'` is the one that matters: the app may only call the
    # origin it came from, so a script that got in could not send a case
    # anywhere. Styles need 'unsafe-inline' because the build inlines them.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    location /api/ {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # The caller's own address, so the gateway's rate limit counts people
        # rather than counting this proxy as one very busy caller.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A committee run takes minutes on the GB10 and the officer copilot is
        # not much quicker. A gateway timeout here would look to a reader like
        # the platform failing rather than a model thinking.
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    # Health, so whatever is in front can tell whether this is up, without
    # reaching the API.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # A single-page app: every unknown path is a route, not a missing file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
