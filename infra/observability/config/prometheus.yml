global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels: { cluster: cio-demo }

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:8889"] }]
  - job_name: cio-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway:8000
          - application:8001
          - document:8002
          - member_intelligence:8003
          - policy:8004
          - feature:8005
          - risk:8006
          - fraud:8007
          - lmi:8008
          - committee:8009
          - core_stub:8010
          - agent_runtime:8011
          - decision:8012
          - execution:8013
          - notification:8014
          - audit:8015
          - governance:8016
          - llm_gateway:8020
