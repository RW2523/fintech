# docs/12 §7 — what CI runs on every push.
#
# The stack is not started here. Everything in this workflow is what can be
# checked without a GPU, a model or a database: lint, types, the unit and
# contract suites, and the half of the harness that needs no service. The
# release gate is `scripts/verify_phase.sh` on the Spark, which runs the whole
# thing against real models, and this file exists to catch the things that
# should never reach that machine.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the workspace
        # --all-extras matters: the data, ml and docai stacks are optional and a
        # plain sync removes them, which breaks the model and document code.
        run: uv sync --all-extras

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Unit and contract tests
        # The service suites need PostgreSQL and skip without it. What runs
        # here is everything that does not: the libraries, the contracts, the
        # models, the guardrails and the synthetic generator.
        run: uv run pytest libs ai ml synthetic workflows contracts -q

      - name: Adversarial corpus
        # No stack needed for the guardrail cases, and these are the ones that
        # must never regress: an injection neutralised 90% of the time is an
        # injection that works.
        run: uv run python -m ai.evals.harness --set adversarial --provider fake --offline

      - name: Upload the harness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-report
          path: ai/evals/reports/
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Typecheck the workbench
        run: npx tsc --noEmit
